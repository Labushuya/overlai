# CHANGE-MARKER v0.1.0: Initiales Projektgrundgerüst (siehe CHANGELOG.md)
# OverlAI — Gradle-Properties.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX + Kotlin
android.useAndroidX=true
kotlin.code.style=official

# Non-transitive R-Klassen (kleinere, schnellere Builds im Multi-Modul)
android.nonTransitiveRClass=true
