# CHANGE-MARKER v0.1.0: Initiales Projektgrundgerüst (siehe CHANGELOG.md)
# OverlAI — release-please. Sammelt Conventional Commits auf main in einem
# Release-PR (Version-Bump + CHANGELOG). Beim Merge wird ein Tag v* erzeugt,
# der release.yml (signierte APK + GitHub Release + latest.json) auslöst.
name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
