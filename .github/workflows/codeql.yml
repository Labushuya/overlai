# CHANGE-MARKER v0.1.0: Initiales Projektgrundgerüst (siehe CHANGELOG.md)
# OverlAI — CodeQL SAST für Kotlin/Java. Scan bei PR und Push auf main.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@main
        with:
          languages: java-kotlin

      # Manueller Build, damit CodeQL den Kotlin-Bytecode sieht.
      - name: Build für Analyse
        run: ./gradlew :app:assembleDebug

      - name: CodeQL-Analyse
        uses: github/codeql-action/analyze@main
