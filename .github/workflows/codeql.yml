# CHANGE-MARKER v0.1.0: Initiales Projektgrundgerüst (siehe CHANGELOG.md)
# OverlAI — CodeQL SAST für Kotlin/Java. Scan bei PR und Push auf main.
name: CodeQL

# Wöchentlicher "schedule"-Trigger am 2026-09-28 entfernt: scannte nur den
# unveränderten main-Stand und erzeugte wöchentliche Fehler-Mails (KI-gestützt,
# Claude Code, im Auftrag des Inhabers), siehe PR #54.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      # v4.0.4 statt v3.2.2: cmdline-tools 16.0 kennt das Paket "tools" nicht mehr
      # (setup-android #538) – geändert 2026-09-28 (KI-gestützt, Claude Code, im
      # Auftrag des Inhabers), siehe PR #54.
      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: CodeQL initialisieren
        uses: github/codeql-action/init@main
        with:
          languages: java-kotlin

      # Manueller Build, damit CodeQL den Kotlin-Bytecode sieht.
      - name: Build für Analyse
        run: ./gradlew :app:assembleDebug

      - name: CodeQL-Analyse
        uses: github/codeql-action/analyze@main
