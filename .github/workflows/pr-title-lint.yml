# CHANGE-MARKER v0.1.0: Initiales Projektgrundgerüst (siehe CHANGELOG.md)
# OverlAI — erzwingt Conventional-Commit-Titel auf PRs (Grundlage für release-please).
name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@0723387faaf9b38adef4775cd42cfd5155ed6017 # v5.5.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Erlaubte Typen — deckungsgleich mit CONTRIBUTING.md.
          types: |
            feat
            fix
            docs
            ci
            chore
            refactor
            test
            perf
            build
