# CHANGE-MARKER v0.1.0: Initiales Projektgrundgerüst (siehe CHANGELOG.md)
# OverlAI — Dependabot. Wöchentliche Updates für Gradle-Deps und GitHub Actions.
version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:13"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    labels: ["dependencies"]
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "com.google.devtools.ksp*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:19"
    commit-message:
      prefix: "ci"
    labels: ["ci", "dependencies"]
